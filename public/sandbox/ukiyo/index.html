  :root { --ink: #121212; --white: #f2efe6; --jp: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', Osaka, sans-serif;
    --min: 'Hiragino Mincho ProN', 'Hiragino Mincho Pro', 'Yu Mincho', 'Shippori Embed', serif; --mono: Monaco, Menlo, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    font: 12px/1.4 var(--jp); color: #77736b; -webkit-font-smoothing: antialiased; background: #fbfbf9; }
  body.mac { background: radial-gradient(ellipse 60% 55% at 50% 46%, #23211d 0%, #141412 60%, #0e0e0d 100%); }
  body.paper #wrap, body.mac #sheet { display: none; }

  /* ---------- the white page: the print floats on it and dissolves at its edges ---------- */
  #sheet { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 22px; }
  #printWrap { position: relative; flex: none; }
  body.paper #content { position: absolute; left: 0; top: 0; transform-origin: 0 0; background: transparent; }
  body.paper #menubar { position: fixed; top: 0; left: 0; right: 0; zoom: 1.2; z-index: 60; }
  #below { display: flex; align-items: center; gap: 22px; font: 11px/1 var(--mono); color: #6f6c66; zoom: 1.08; }
  #ptitle { font: 600 13px/1 var(--min); color: #2a2826; letter-spacing: .04em; }
  #eps { display: flex; gap: 6px; }
  #eps b { --c: #fff3da; display: block; padding: 3px; cursor: pointer; font-weight: 600;
    background: radial-gradient(circle, transparent 1.5px, var(--c) 1.8px) -2.5px -2.5px / 5px 5px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.12)); }
  #eps b span { display: block; width: 22px; height: 26px; background: var(--c); font: 600 14px/26px var(--min); text-align: center; color: #2a2826; }
  #eps b.on { --c: #c23b2b; }
  #eps b.on span { color: #fbf3e4; }
  body.paper #status span:last-child { display: none; }
  body.paper #status { height: auto; border: none; padding: 0; gap: 22px; font: 11px/1 var(--mono); }
  body.paper .card { background: transparent; color: #141414; }
  body.paper .card div { -webkit-text-stroke-color: #141414; }
  body.paper #dialog, body.paper #note { position: fixed; zoom: 1.25; color: var(--ink); }
  body.paper #dialog { top: 28vh; }
  body.paper #note { left: 50%; top: 22vh; transform: translateX(-50%); }
  /* on the white page the words sit in the paper under the print, in ink, away from the people */
  body.paper #subs { bottom: 9px; color: #1c1a18; text-shadow: none; font-size: 15px; letter-spacing: .03em; }
  @media (max-width: 640px) { #ptitle, #pstat { display: none; } }
  body:not(.inicio) #below { transition: opacity 1.4s; }
  body.inicio #below { opacity: 0; pointer-events: none; }
  #title { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }

  /* ---------- the machine ---------- */
  #wrap { position: relative; flex: none; }
  #stage { position: absolute; left: 0; top: 0; width: 716px; height: 652px; transform-origin: 0 0; }
  .body { position: absolute; left: 0; top: 0; width: 716px; height: 640px; border-radius: 26px 26px 18px 18px;
    background: linear-gradient(180deg, #ece5d4 0%, #e3dbc8 55%, #d9d0bb 100%); border: 2px solid #2a251e;
    box-shadow: inset -14px 0 0 rgba(110, 92, 62, .13), inset 0 3px 0 #f7f2e7, inset 3px 0 0 #f1ebde, 0 40px 80px -30px rgba(0,0,0,.8); }
  .foot { position: absolute; left: 70px; top: 636px; width: 576px; height: 16px; border-radius: 0 0 10px 10px;
    background: linear-gradient(#cdc3ac, #b9ae95); border: 2px solid #2a251e; border-top: none; }
  .bezel { position: absolute; left: 16px; top: 16px; width: 684px; height: 524px; border-radius: 22px;
    background: #d6cdb7; border: 1.5px solid #3a3328;
    box-shadow: inset 0 5px 0 #bdb39b, inset 4px 0 0 #c6bca4, inset 0 -3px 0 #efe9dc, inset -3px 0 0 #e6dfcf; }
  .glass { position: absolute; left: 28px; top: 28px; width: 660px; height: 500px; border-radius: 18px; background: #151816;
    box-shadow: inset 0 0 0 1.5px #0b0c0b, inset 0 6px 14px rgba(0,0,0,.7); }
  .chin { position: absolute; left: 0; top: 540px; width: 716px; height: 100px; }
  .logo { position: absolute; left: 40px; top: 30px; width: 26px; height: 26px; border-radius: 5px; background: #c23b2b;
    color: #f6eee0; font: 600 17px/26px var(--min); text-align: center; box-shadow: inset -2px -2px 0 rgba(0,0,0,.18); }
  .label { position: absolute; left: 76px; top: 33px; font: 600 14px/20px var(--min); color: #5e5546; letter-spacing: .06em; }
  .label i { font-style: normal; font-size: 12px; margin-left: 6px; color: #7d725f; }
  .slot { position: absolute; left: 470px; top: 36px; width: 176px; height: 11px; border-radius: 6px; background: #2c2924;
    box-shadow: inset 0 3px 0 #141310, 0 1.5px 0 #f3eee2; }
  .slot::after { content: ''; position: absolute; right: -16px; top: 3px; width: 6px; height: 6px; border-radius: 50%;
    background: #3a362f; box-shadow: 0 1px 0 #f3eee2; }
  .vfd { position: absolute; left: 320px; top: 29px; width: 104px; height: 24px; border-radius: 4px; background: #1d1a15;
    box-shadow: inset 0 2px 0 #0e0c09, 0 1.5px 0 #f3eee2; font: 13px/24px var(--mono); color: #ffae4a; text-align: center;
    letter-spacing: .12em; text-shadow: 0 0 6px rgba(255, 140, 40, .75), 0 0 1px #ffd9a0; }
  .led { position: absolute; left: 270px; top: 39px; width: 6px; height: 6px; border-radius: 50%; background: #7fe07a;
    box-shadow: 0 0 6px #7fe07a; }
  .grooves { position: absolute; left: 30px; right: 30px; top: 74px; height: 12px;
    background: repeating-linear-gradient(180deg, rgba(60,50,35,.2) 0 1px, rgba(255,255,255,.5) 1px 2px, transparent 2px 4px); }

  /* ---------- the CRT ---------- */
  #crt { position: absolute; left: 38px; top: 38px; width: 640px; height: 480px; border-radius: 12px; overflow: hidden;
    background: var(--white); color: var(--ink); font: 600 12px/20px var(--jp); -webkit-font-smoothing: none; cursor: default; }
  #crt::after { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 50; border-radius: 12px;
    background: repeating-linear-gradient(180deg, rgba(0,0,0,.07) 0 1px, transparent 1px 2px),
      radial-gradient(ellipse 120% 90% at 30% 10%, rgba(255,255,255,.10), transparent 45%);
    box-shadow: inset 0 0 40px rgba(0,0,0,.42), inset 0 0 8px rgba(0,0,0,.5); }
  #crt.flat::after { background: none; box-shadow: none; }
  #menubar { position: absolute; left: 0; top: 0; right: 0; height: 20px; background: var(--white); border-bottom: 1px solid var(--ink);
    display: flex; align-items: center; z-index: 30; color: var(--ink); font: 600 12px/20px var(--jp); -webkit-font-smoothing: none; }
  #menus { display: flex; height: 100%; padding-left: 8px; }
  .menu { position: relative; height: 100%; }
  .mt { display: block; height: 19px; padding: 0 9px; line-height: 19px; }
  .menu.open > .mt, .menu.flash > .mt { background: var(--ink); color: var(--white); }
  .seal-ico { display: inline-block; width: 14px; height: 14px; margin-top: 2px; background: #c23b2b; color: #f6eee0;
    font: 600 10px/14px var(--min); font-style: normal; text-align: center; border-radius: 2px; vertical-align: top; }
  .dd { display: none; position: absolute; left: 0; top: 20px; min-width: 190px; background: var(--white); border: 1px solid var(--ink);
    box-shadow: 1px 1px 0 var(--ink); padding: 2px 0; z-index: 40; }
  .menu.open .dd { display: block; }
  .it { display: flex; align-items: center; height: 17px; padding: 0 12px 0 0; white-space: nowrap; }
  .it .ck { width: 16px; text-align: center; font-weight: 600; }
  .it.on .ck::before { content: '✓'; }
  .it span { flex: 1; }
  .it em { font-style: normal; font: 10px var(--mono); margin-left: 18px; opacity: .8; }
  .it:hover:not(.off) { background: var(--ink); color: var(--white); }
  .it.off { color: #9a978f; }
  .sep { height: 1px; margin: 3px 0; background: repeating-linear-gradient(90deg, #8b887f 0 1px, transparent 1px 2px); }
  .right { margin-left: auto; display: flex; align-items: center; gap: 10px; padding-right: 10px; }
  #clock { font: 600 12px/20px var(--jp); }
  #sound { width: 16px; height: 14px; position: relative; cursor: default; opacity: .45; }
  #sound::before { content: ''; position: absolute; left: 1px; top: 4px; width: 4px; height: 6px; background: var(--ink); }
  #sound::after { content: ''; position: absolute; left: 3px; top: 1px; border: 6px solid transparent; border-right-color: var(--ink);
    border-left: 0; height: 0; }
  #sound.on { opacity: 1; }
  #sound.on i { position: absolute; right: 0; top: 2px; width: 5px; height: 10px; border: 1.5px solid var(--ink); border-left: 0;
    border-radius: 0 6px 6px 0; }
  #desk { position: absolute; left: 0; top: 20px; right: 0; bottom: 0; image-rendering: pixelated; background-size: 24px 12px; }

  .window { position: absolute; left: 13px; top: 7px; width: 614px; background: var(--white); border: 1px solid var(--ink);
    box-shadow: 1px 1px 0 var(--ink); }
  .titlebar { position: relative; height: 19px; border-bottom: 1px solid var(--ink); }
  .titlebar::before { content: ''; position: absolute; left: 2px; right: 2px; top: 3px; height: 11px;
    background: repeating-linear-gradient(180deg, var(--ink) 0 1px, transparent 1px 2px); }
  .box { position: absolute; top: 3px; width: 11px; height: 11px; border: 1px solid var(--ink); background: var(--white);
    box-shadow: 0 0 0 1px var(--white); z-index: 1; }
  .box.close { left: 8px; }
  .box.zoom { right: 8px; }
  .box.zoom::after { content: ''; position: absolute; left: 0; top: 0; width: 5px; height: 5px; border-right: 1px solid var(--ink);
    border-bottom: 1px solid var(--ink); }
  #wtitle { position: absolute; left: 50%; top: 0; transform: translateX(-50%); padding: 0 7px; background: var(--white);
    line-height: 18px; white-space: nowrap; z-index: 1; }
  #content { position: relative; width: 612px; height: 408px; overflow: hidden; background: #000; cursor: crosshair; }
  #print { display: block; width: 612px; height: 408px; }
  #status { height: 15px; border-top: 1px solid var(--ink); display: flex; justify-content: space-between; padding: 0 6px;
    font: 9px/14px var(--mono); -webkit-font-smoothing: antialiased; white-space: nowrap; }

  /* Evangelion title card */
  .card { position: absolute; inset: 0; background: #050505; color: #f4f0e6; font-family: var(--min); font-weight: 600;
    display: none; z-index: 8; -webkit-font-smoothing: antialiased; }
  .card.show { display: block; }
  .card div { position: absolute; left: 34px; white-space: nowrap; transform-origin: 0 0; -webkit-text-stroke: 1.4px #f4f0e6; }
  .card .ep { top: 34px; font-size: 34px; letter-spacing: .02em; }
  .card .t1 { top: 92px; font-size: 98px; line-height: 1; transform: scaleX(.84); }
  .card .t2 { top: 200px; font-size: 98px; line-height: 1; transform: scaleX(.84); }
  .card .t2.one { top: 196px; font-size: 128px; transform: scaleX(.9); }
  .card .en { top: 352px; font: 600 19px/1 'Times New Roman', var(--min); letter-spacing: .04em; -webkit-text-stroke: .4px #f4f0e6; }
  .card.end .kan { top: 64px; left: 50%; font-size: 200px; line-height: 1; transform: translateX(-50%); }
  .card.end .sub { top: 290px; left: 50%; font-size: 28px; transform: translateX(-50%); letter-spacing: .3em; -webkit-text-stroke: .6px #f4f0e6; }
  .card.end .en { top: 338px; left: 50%; transform: translateX(-50%); font-size: 15px; letter-spacing: .3em; }

  /* anime subtitles */
  #subs { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; z-index: 6; pointer-events: none;
    font: 600 17px/1.3 var(--min); color: #fbf7ea; opacity: 0; transition: opacity .18s; -webkit-font-smoothing: antialiased;
    text-shadow: 1.5px 0 0 #111, -1.5px 0 0 #111, 0 1.5px 0 #111, 0 -1.5px 0 #111, 1px 1px 0 #111, -1px -1px 0 #111, 1px -1px 0 #111, -1px 1px 0 #111, 0 2px 6px rgba(0,0,0,.4); }
  #subs.show { opacity: 1; }
  #subs.off { display: none; }

  /* the tracking reticle that follows the letter */
  #hud { position: absolute; left: 0; top: 0; width: 46px; height: 36px; margin: -18px 0 0 -23px; z-index: 5; pointer-events: none;
    opacity: 0; transition: opacity .25s; --c: #ff8c2a; }
  #hud.show { opacity: .95; }
  #hud i { position: absolute; width: 8px; height: 8px; border: 1.5px solid var(--c); }
  #hud i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; }
  #hud i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; }
  #hud i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; }
  #hud i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; }
  #hud::after { content: attr(data-label); position: absolute; left: 50px; top: -2px; font: 8px/10px var(--mono); color: var(--c);
    white-space: pre; letter-spacing: .06em; -webkit-font-smoothing: antialiased; text-shadow: 0 0 3px rgba(0,0,0,.6); }

  /* alert and the letter window */
  #dialog { position: absolute; left: 50%; top: 150px; width: 330px; transform: translateX(-50%); background: var(--white);
    border: 1px solid var(--ink); outline: 3px solid var(--white); box-shadow: 0 0 0 4px var(--ink), 4px 4px 0 4px var(--ink);
    padding: 14px 16px 12px; display: none; z-index: 45; font-weight: 400; font-size: 11px; line-height: 1.55; }
  #dialog.show { display: block; }
  #dialog p { margin: 0 0 8px; }
  #dialog b { font-weight: 700; font-size: 12px; }
  .seal-big { float: left; width: 34px; height: 34px; margin: 0 12px 6px 0; background: #c23b2b; color: #f6eee0; text-align: center;
    font: 600 22px/34px var(--min); border-radius: 3px; }
  .btns { display: flex; justify-content: flex-end; gap: 10px; clear: both; }
  .btns button { font: 600 12px var(--jp); background: var(--white); color: var(--ink); border: 1px solid var(--ink); border-radius: 7px;
    padding: 2px 16px; cursor: default; }
  .btns button.def { box-shadow: 0 0 0 1.5px var(--white), 0 0 0 3.5px var(--ink); }
  .btns button:active { background: var(--ink); color: var(--white); }
  #note { position: absolute; left: 196px; top: 70px; width: 300px; background: var(--white); border: 1px solid var(--ink);
    box-shadow: 1px 1px 0 var(--ink); display: none; z-index: 44; }
  #note.show { display: block; }
  #note .titlebar #ntitle { position: absolute; left: 50%; top: 0; transform: translateX(-50%); padding: 0 7px; background: var(--white);
    line-height: 18px; z-index: 1; }
  .nbody { padding: 12px 14px 16px; min-height: 120px; white-space: pre-wrap; font: 400 13px/1.75 var(--min); -webkit-font-smoothing: antialiased; }
  .nbody .run { display: inline-block; width: 1em; height: 1em; vertical-align: -.12em; margin-right: -.1em; border-radius: 45% 55% 50% 50%;
    background: radial-gradient(ellipse at 45% 55%, rgba(70,100,146,.72), rgba(92,126,162,.34) 58%, rgba(92,126,162,0) 74%); transform: scale(1.5); }
</style>
